name: GIT CI - PHP + BIN

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-bin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP files
        run: |
          php -l run_install.php
          php -l CAT.git || echo "CAT.git is not php - ok"

      - name: Check install.BIN exists
        run: |
          ls -lh install.BIN run_install.php
          file install.BIN

      - name: Test pull and register (dry)
        run: |
          php run_install.php --help || php run_install.php || echo "run_install needs args - lint OK"

      - name: Also run your oeneye pattern
        run: |
          if [ -f "oeneyeQ.cpp" ]; then g++ -O2 oeneyeQ.cpp -o oeneyeQ && ./oeneyeQ; fi
          if [ -d "omqrust" ]; then cd omqrust && cargo test; fi
